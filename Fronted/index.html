<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <div class="success-message" id="successMessage">
            Form submitted successfully! 🎉
        </div>
        
        <form id="contactForm">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
            </div>

            <div class="options-container">
                <div class="option-card" data-option="file">
                    <div class="option-title">Option 1</div>
                    <div class="option-subtitle">File Upload</div>
                    <label for="fileInput" class="file-label">Choose File</label>
                    <input type="file" id="fileInput" name="file" class="file-input">
                    <div class="file-info" id="fileInfo"></div>
                </div>

                <div class="option-card" data-option="url">
                    <div class="option-title">Option 2</div>
                    <div class="option-subtitle">YouTube URL</div>
                    <div class="url-input" id="urlInput">
                        <input type="url" id="youtubeUrl" name="youtubeUrl" placeholder="Enter YouTube URL">
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <span>Submit</span>
            </button>
        </form>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
