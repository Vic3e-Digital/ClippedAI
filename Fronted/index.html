<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Upload Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
   
    <div class="success-message" id="successMessage">
      Form submitted successfully! 🎉
    </div>
 
    <form id="contactForm">
      <div class="form-group">
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Business Name"
          required
        >
      </div>
 
      <div class="option-card selected" data-option="file">
        <div class="option-title">Video Upload</div>
        <div class="option-subtitle">MP4 files only</div>
 
        <label for="fileInput" class="file-label">Choose Video</label>
        <input
          type="file"
          id="fileInput"
          name="file"
          class="file-input"
          accept="video/*"
          required
        >
       
        <div class="file-info" id="fileInfo"></div>
      </div>
 
      <div class="form-group">
        <textarea
          id="notes"
          name="notes"
          placeholder="Notes (optional)"
        ></textarea>
      </div>
 
      <button type="submit" class="submit-btn">
        <span>Submit</span>
      </button>
    </form>
   
  </div>
  <script src="script.js"></script>
</body>
</html>
